# ===========================================================
# General
# ===========================================================

set -g mouse on
setw -g mode-keys vi
set-option -sa terminal-overrides ",xterm*:Tc"
set -g allow-passthrough on

# ===========================================================
# Prefix
# ===========================================================

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ===========================================================
# Key Bindings
# ===========================================================

bind -n M-H previous-window
bind -n M-L next-window
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# ===========================================================
# Windows & Panes
# ===========================================================

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g automatic-rename on

# ===========================================================
# Terminal Title
# ===========================================================

set -g set-titles on
set -g set-titles-string "#S - #W"

# ===========================================================
# Activity & Notifications
# ===========================================================

set -g monitor-activity off
set -g monitor-bell on
set -g visual-activity off
set -g visual-bell off
set -g bell-action any

# macOS notification on bell
set-hook -g alert-bell 'run-shell "osascript -e \"display notification \\\"Window #I needs attention\\\" with title \\\"tmux: #S\\\" sound name \\\"Ping\\\"\""'

# ===========================================================
# Catppuccin Theme (MUST be before plugin load)
# ===========================================================

set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_date_time_text " %H:%M"

# Load Catppuccin manually (not via TPM) so status module variables
# like @catppuccin_status_session are available for status-left/right
# configuration below. TPM runs too late for that.
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# ===========================================================
# Status Bar (MUST be after Catppuccin load)
# ===========================================================

set -g status-left-length 100
set -g status-right-length 100
set -g status-position bottom

set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# ===========================================================
# Plugins (via TPM)
# Catppuccin is not listed here because it's loaded manually
# above — TPM would load it too late for our status config.
# TPM still manages the plugin directory for updates (prefix+U).
# ===========================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

run '~/.tmux/plugins/tpm/tpm'
